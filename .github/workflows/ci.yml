name: CI/CD Pipeline - Code Quality, Testing & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality-and-tests:
    name: Backend Quality & Tests (Python / FastAPI)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: darukaa_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx
          pip install -r backend/requirements.txt

      - name: Run Ruff Linter & Format Check
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/darukaa_test
          SECRET_KEY: test_secret_key_ci_environment_32_bytes_min
        run: |
          cd backend
          pytest tests/ -v

  frontend-quality-and-build:
    name: Frontend Quality & Build (React / TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Type Check & ESLint
        run: |
          cd frontend
          npm run lint

      - name: Build Frontend Production Bundle
        env:
          VITE_API_URL: https://api.darukaa.earth
          VITE_MAPBOX_TOKEN: pk.sample_token_for_ci_build_verification
        run: |
          cd frontend
          npm run build
