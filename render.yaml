services:
  # 1. Python FastAPI Backend API
  - type: web
    name: darukaa-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: darukaa-postgis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: CORS_ORIGINS
        value: '*'

  # 2. React Production Frontend
  - type: web
    name: darukaa-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://darukaa-backend.onrender.com/api/v1
      - key: VITE_MAPBOX_TOKEN
        value: pk.eyJ1Ijoic3VyeWFuc2hzYXJhZiIsImEiOiJjbTdtOGUxdXowMWdsMm5zYWdtOWlhMG5yIn0.rT_k8G8Q8K23q
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# 3. PostgreSQL Database with PostGIS Extension
databases:
  - name: darukaa-postgis
    plan: free
    region: oregon
    postgresMajorVersion: 16
