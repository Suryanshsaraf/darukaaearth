services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: darukaa_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: darukaa_earth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d darukaa_earth"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: darukaa_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@db:5432/darukaa_earth
      SECRET_KEY: darukaa_production_grade_jwt_secret_key_32_bytes_safe
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost"]'
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: darukaa_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_MAPBOX_TOKEN=pk.eyJ1IjoiZGFydWthYSIsImEiOiJjbTdtOHUxdTIwMHdsMm5zYWdtOWlhMG5yIn0.rT_k8G8Q8K23q
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
