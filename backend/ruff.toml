line-length = 100
target-version = "py311"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # do not perform function calls in argument defaults (standard for FastAPI Depends)
    "E402", # module level import not at top of file (needed for test env setup)
]

[lint.isort]
known-first-party = ["app"]
